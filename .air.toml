root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ."
  delay = 1000
  entrypoint = ["./tmp/main"]
  # web: frontend diurus Vite (npm run dev), dan node_modules terlalu banyak file untuk dipantau.
  # db: perubahan SQL dijalankan lewat migrate, bukan dengan membangun ulang server.
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "web", "db"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  # Bersama send_interrupt: server dihentikan dengan interrupt dulu, jadi berhenti dengan rapi (request yang sedang
  # berjalan ditunggu sampai 10 detik). Kalau setelah 11 detik belum berhenti, baru dipaksa.
  kill_delay = "11s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
